# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
# max size for profile picture uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# SWAGGER / OPENAPI CONFIGURATION
# ===============================
# Swagger UI access path → http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# API docs path — must match SecurityConfig PUBLIC_URLS
springdoc.api-docs.path=/v3/api-docs

# enable Try it out button on all endpoints by default
springdoc.swagger-ui.try-it-out-enabled=true

# sort endpoints alphabetically
springdoc.swagger-ui.operations-sorter=alpha

# ===============================
# LOGGING (FOR DEBUGGING)
# ===============================
# your application logs — change to INFO in production
logging.level.com.aja.internshipportal=DEBUG

# spring security logs — very useful for JWT debugging
logging.level.org.springframework.web=DEBUG


# show SQL queries with parameters
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


