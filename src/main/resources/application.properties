# ===============================
# APPLICATION NAME
# ===============================
spring.application.name=aja-internship-portal-server

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/aja_internship_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=As@110302
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# update → automatically creates/updates tables based on entities
spring.jpa.hibernate.ddl-auto=update

# show SQL queries in console (turn off in production)
spring.jpa.show-sql=true

# format SQL nicely in console
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8.0 dialect — generates correct SQL for MySQL 8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# disable open session in view — prevents lazy loading issues
spring.jpa.open-in-view=false

# ===============================
# JWT CONFIGURATION
# ===============================
# secret key — must be at least 32 characters, no underscores around property name
app.jwt.secret=mysupersecretkeymysupersecretkey12345

# access token — 15 minutes (short lived, sent with every request)
app.jwt.expiration-ms=900000

# refresh token — 7 days (long lived, used to get new access token)
app.jwt.refresh-expiration-ms=604800000

# ===============================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# use Gmail App Password — not your actual Google account password
# generate at: myaccount.google.com → Security → App Passwords
spring.mail.username=ashokkumarnimmaturi@gmail.com
spring.mail.password=rfrgiilnsuzfypll

# enable SMTP authentication
spring.mail.properties.mail.smtp.auth=true

# enable TLS encryption
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# RAZORPAY CONFIGURATION
# ===============================
