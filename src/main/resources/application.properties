# ===============================
# APPLICATION NAME
# ===============================
spring.application.name=aja-internship-portal-server

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8080

# ===============================
# DATABASE CONFIGURATION (MySQL)
# ===============================
# IMPORTANT: Keep URL in single line (no backslashes)
spring.datasource.url=jdbc:mysql://localhost:3306/aja_internship_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=As@110302
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
# update → automatically creates/updates tables
spring.jpa.hibernate.ddl-auto=update

# show SQL queries in console
spring.jpa.show-sql=true

# format SQL nicely
spring.jpa.properties.hibernate.format_sql=true

# Hibernate will auto-detect dialect → no need to specify
# (you can remove this if you want)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# disable open session in view (good practice)
spring.jpa.open-in-view=false

# ===============================
# JWT CONFIGURATION
# ===============================
# IMPORTANT: Secret must be at least 32 characters
app.jwt.secret=mysupersecretkeymysupersecretkey12345

# Access token validity → 15 minutes
app.jwt.expiration-ms=900000

# Refresh token validity → 7 days
app.jwt.refresh-expiration-ms=604800000

# ===============================
# EMAIL CONFIGURATION (GMAIL SMTP)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your.email@gmail.com
spring.mail.password=your_app_password

# enable authentication
spring.mail.properties.mail.smtp.auth=true

# enable TLS
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# SWAGGER / OPENAPI CONFIGURATION
# ===============================
# Swagger UI access path
springdoc.swagger-ui.path=/swagger-ui.html

# IMPORTANT: Must match SecurityConfig
springdoc.api-docs.path=/v3/api-docs

# ===============================
# LOGGING (FOR DEBUGGING)
# ===============================
# your application logs
logging.level.com.aja.internshipportal=DEBUG

# spring security logs (very useful for JWT debugging)
logging.level.org.springframework.security=DEBUG

# show SQL queries
logging.level.org.hibernate.SQL=DEBUG